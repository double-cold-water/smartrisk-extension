<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartRisk</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            min-height: 100vh;
        }
        h1 { font-size: 24px; margin-bottom: 20px; display: flex; align-items: center; gap: 10px; }
        .card { 
            background: rgba(255, 255, 255, 0.15); 
            padding: 20px; 
            border-radius: 12px; 
            margin: 15px 0;
            backdrop-filter: blur(10px);
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 15px;
        }
        .metric {
            background: rgba(255, 255, 255, 0.2);
            padding: 20px;
            border-radius: 10px;
            text-align: center;
        }
        .metric-label { font-size: 12px; opacity: 0.9; text-transform: uppercase; margin-bottom: 8px; }
        .metric-value { font-size: 32px; font-weight: bold; line-height: 1.2; }
        .alert {
            background: rgba(255, 59, 48, 0.3);
            border-left: 4px solid #ff3b30;
            padding: 15px 20px;
            border-radius: 8px;
            margin-top: 15px;
        }
        .success {
            background: rgba(52, 199, 89, 0.3);
            border-left: 4px solid #34c759;
            padding: 15px 20px;
            border-radius: 8px;
            margin-top: 15px;
        }
    </style>
</head>
<body>
    <h1>🎯 SmartRisk Portfolio Analysis</h1>
    <div id="app"><div class="card"><p id="status">⏳ Connecting...</p></div></div>

    <script src="https://online.tableau.com/javascripts/api/tableau.extensions.1.latest.js" type="text/javascript"></script>
    
    <script type="text/javascript">
    (function() {
        'use strict';
        
        var app = document.getElementById('app');
        var status = document.getElementById('status');
        var attempts = 0;
        var maxAttempts = 20;
        
        function updateStatus(msg) {
            if (status) status.textContent = msg;
        }
        
        function checkAPI() {
            attempts++;
            updateStatus('Checking API... Attempt ' + attempts);
            
            if (window.tableau && tableau.extensions) {
                updateStatus('API found! Initializing...');
                init();
            } else if (attempts < maxAttempts) {
                setTimeout(checkAPI, 500);
            } else {
                showError('Could not load Tableau API after ' + attempts + ' attempts');
            }
        }
        
        function init() {
            tableau.extensions.initializeAsync().then(function() {
                updateStatus('Initialized! Loading data...');
                loadData();
            }).catch(function(err) {
                showError('Init failed: ' + err.message);
            });
        }
        
        function loadData() {
            try {
                var dashboard = tableau.extensions.dashboardContent.dashboard;
                var worksheets = dashboard.worksheets;
                
                if (!worksheets || worksheets.length === 0) {
                    showError('No worksheets found');
                    return;
                }
                
                var worksheet = worksheets[0];
                updateStatus('Loading from: ' + worksheet.name);
                
                worksheet.getSummaryDataAsync().then(function(dataTable) {
                    processData(dataTable);
                }).catch(function(err) {
                    showError('Data load failed: ' + err.message);
                });
                
            } catch (err) {
                showError('Error: ' + err.message);
            }
        }
        
        function processData(dataTable) {
            var columns = dataTable.columns;
            var rows = dataTable.data;
            
            var valueIdx = -1, riskIdx = -1;
            
            for (var i = 0; i < columns.length; i++) {
                var name = columns[i].fieldName.toLowerCase();
                if (name.indexOf('value') !== -1 || name.indexOf('total') !== -1) {
                    valueIdx = i;
                }
                if (name.indexOf('risk') !== -1) {
                    riskIdx = i;
                }
            }
            
            if (valueIdx === -1 || riskIdx === -1) {
                showError('Columns not found. Need "value" and "risk" columns.');
                return;
            }
            
            var total = 0, riskSum = 0, count = 0;
            
            for (var i = 0; i < rows.length; i++) {
                var val = parseFloat(rows[i][valueIdx].value) || 0;
                var risk = parseFloat(rows[i][riskIdx].value) || 0;
                total += val;
                riskSum += risk;
                count++;
            }
            
            var avgRisk = count > 0 ? riskSum / count : 0;
            var level = avgRisk > 0.6 ? 'HIGH' : avgRisk > 0.4 ? 'MEDIUM' : 'LOW';
            var color = avgRisk > 0.6 ? '#ff3b30' : avgRisk > 0.4 ? '#ff9500' : '#34c759';
            
            display(total, avgRisk, level, color, count);
        }
        
        function display(total, avgRisk, level, color, count) {
            var formatted = total >= 1000000 ? 
                '$' + (total / 1000000).toFixed(1) + 'M' :
                '$' + (total / 1000).toFixed(0) + 'K';
            
            var html = '<div class="grid">';
            html += '<div class="metric"><div class="metric-label">Total Value</div><div class="metric-value">' + formatted + '</div></div>';
            html += '<div class="metric"><div class="metric-label">Avg Risk</div><div class="metric-value" style="color:' + color + '">' + avgRisk.toFixed(2) + '</div></div>';
            html += '<div class="metric"><div class="metric-label">Risk Level</div><div class="metric-value">' + level + '</div></div>';
            html += '<div class="metric"><div class="metric-label">Assets</div><div class="metric-value">' + count + '</div></div>';
            html += '</div>';
            
            if (avgRisk > 0.6) {
                html += '<div class="alert"><strong>⚠️ High Risk Alert</strong><br>Portfolio risk (' + avgRisk.toFixed(2) + ') exceeds safe threshold. Consider rebalancing.</div>';
            } else {
                html += '<div class="success"><strong>✅ Portfolio Healthy</strong><br>Risk level (' + avgRisk.toFixed(2) + ') within acceptable range.</div>';
            }
            
            app.innerHTML = html;
        }
        
        function showError(msg) {
            app.innerHTML = '<div class="card"><h3 style="color:#ff3b30;">❌ Error</h3><p>' + msg + '</p></div>';
        }
        
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', function() {
                setTimeout(checkAPI, 500);
            });
        } else {
            setTimeout(checkAPI, 500);
        }
        
    })();
    </script>
</body>
</html>
