<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>SmartRisk</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
        }
        h1 { font-size: 24px; margin-bottom: 20px; }
        .card { 
            background: rgba(255, 255, 255, 0.15); 
            padding: 20px; 
            border-radius: 12px; 
            backdrop-filter: blur(10px);
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 15px;
            margin: 20px 0;
        }
        .metric {
            background: rgba(255, 255, 255, 0.2);
            padding: 20px;
            border-radius: 10px;
            text-align: center;
        }
        .metric-label { font-size: 12px; opacity: 0.9; text-transform: uppercase; margin-bottom: 8px; }
        .metric-value { font-size: 32px; font-weight: bold; }
        .alert, .success {
            padding: 15px 20px;
            border-radius: 8px;
            margin-top: 15px;
        }
        .alert { background: rgba(255, 59, 48, 0.3); border-left: 4px solid #ff3b30; }
        .success { background: rgba(52, 199, 89, 0.3); border-left: 4px solid #34c759; }
    </style>
</head>
<body>
    <h1>🎯 SmartRisk Portfolio Analysis</h1>
    <div id="app"><div class="card"><p id="status">⏳ Initializing...</p></div></div>

    <script type="text/javascript">
    (function() {
        'use strict';
        
        var app = document.getElementById('app');
        
        // Tableau Extensions API is preloaded in Tableau Cloud
        // We just need to wait for the window to be ready
        
        function init() {
            try {
                // Check if tableau object exists
                if (typeof tableau === 'undefined') {
                    showError('Tableau object not found. Please ensure this extension is loaded in Tableau Dashboard.');
                    return;
                }
                
                if (!tableau.extensions) {
                    showError('Tableau extensions not available.');
                    return;
                }
                
                // Initialize the extension
                tableau.extensions.initializeAsync().then(function() {
                    loadData();
                }).catch(function(err) {
                    showError('Initialization error: ' + err.toString());
                });
                
            } catch (err) {
                showError('Error: ' + err.toString());
            }
        }
        
        function loadData() {
            try {
                var dashboard = tableau.extensions.dashboardContent.dashboard;
                var worksheets = dashboard.worksheets;
                
                if (!worksheets || worksheets.length === 0) {
                    showError('No worksheets found in dashboard');
                    return;
                }
                
                var worksheet = worksheets[0];
                
                worksheet.getSummaryDataAsync().then(function(dataTable) {
                    processData(dataTable);
                }).catch(function(err) {
                    showError('Data loading error: ' + err.toString());
                });
                
            } catch (err) {
                showError('Error accessing dashboard: ' + err.toString());
            }
        }
        
        function processData(dataTable) {
            try {
                var columns = dataTable.columns;
                var rows = dataTable.data;
                
                var valueIdx = -1, riskIdx = -1;
                
                for (var i = 0; i < columns.length; i++) {
                    var name = columns[i].fieldName.toLowerCase();
                    if (name.indexOf('value') !== -1) valueIdx = i;
                    if (name.indexOf('risk') !== -1) riskIdx = i;
                }
                
                if (valueIdx === -1 || riskIdx === -1) {
                    showError('Required columns not found');
                    return;
                }
                
                var total = 0, riskSum = 0, count = 0;
                
                for (var i = 0; i < rows.length; i++) {
                    total += parseFloat(rows[i][valueIdx].value) || 0;
                    riskSum += parseFloat(rows[i][riskIdx].value) || 0;
                    count++;
                }
                
                var avgRisk = count > 0 ? riskSum / count : 0;
                var level = avgRisk > 0.6 ? 'HIGH' : avgRisk > 0.4 ? 'MEDIUM' : 'LOW';
                var color = avgRisk > 0.6 ? '#ff3b30' : avgRisk > 0.4 ? '#ff9500' : '#34c759';
                
                display(total, avgRisk, level, color, count);
                
            } catch (err) {
                showError('Processing error: ' + err.toString());
            }
        }
        
        function display(total, avgRisk, level, color, count) {
            var formatted = total >= 1000000 ? 
                '$' + (total / 1000000).toFixed(1) + 'M' :
                '$' + (total / 1000).toFixed(0) + 'K';
            
            var html = '<div class="grid">';
            html += '<div class="metric"><div class="metric-label">Total Value</div><div class="metric-value">' + formatted + '</div></div>';
            html += '<div class="metric"><div class="metric-label">Avg Risk</div><div class="metric-value" style="color:' + color + '">' + avgRisk.toFixed(2) + '</div></div>';
            html += '<div class="metric"><div class="metric-label">Risk Level</div><div class="metric-value">' + level + '</div></div>';
            html += '<div class="metric"><div class="metric-label">Assets</div><div class="metric-value">' + count + '</div></div>';
            html += '</div>';
            
            if (avgRisk > 0.6) {
                html += '<div class="alert"><strong>⚠️ High Risk Alert</strong><br>Portfolio risk score (' + avgRisk.toFixed(2) + ') exceeds recommended threshold. Consider rebalancing toward fixed-income assets.</div>';
            } else {
                html += '<div class="success"><strong>✅ Portfolio Health Good</strong><br>Your risk level (' + avgRisk.toFixed(2) + ') is within acceptable range.</div>';
            }
            
            app.innerHTML = html;
        }
        
        function showError(msg) {
            app.innerHTML = '<div class="card"><h3 style="color:#ff3b30;">❌ Error</h3><p>' + msg + '</p></div>';
        }
        
        // Wait for page to be fully loaded
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }
        
    })();
    </script>
</body>
</html>
