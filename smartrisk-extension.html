   <!DOCTYPE html>
   <html>
   <head>
       <meta charset="utf-8">
       <title>SmartRisk Extension</title>
       <script src="https://cdn.jsdelivr.net/npm/tableau-extensions-api@1.10.0/tableau.extensions.1.latest.min.js"></script>
       <style>
           body {
               font-family: Arial, sans-serif;
               padding: 20px;
               background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
               color: white;
           }
           .container { max-width: 800px; margin: 0 auto; }
           h1 { margin-bottom: 20px; }
           .metric-card {
               background: rgba(255, 255, 255, 0.2);
               padding: 20px;
               border-radius: 10px;
               margin: 10px 0;
           }
           .metric-value { font-size: 32px; font-weight: bold; }
       </style>
   </head>
   <body>
       <div class="container">
           <h1>🎯 Portfolio Risk Analysis</h1>
           <div id="content">Loading...</div>
       </div>
       
       <script>
           tableau.extensions.initializeAsync().then(function() {
               const dashboard = tableau.extensions.dashboardContent.dashboard;
               document.getElementById('content').innerHTML = `
                   <div class="metric-card">
                       <div>Dashboard: ${dashboard.name}</div>
                       <div class="metric-value">✓ Connected</div>
                   </div>
               `;
           }).catch(function(err) {
               document.getElementById('content').innerHTML = 
                   '<div class="metric-card">Error: ' + err + '</div>';
           });
       </script>
   </body>
   </html>
